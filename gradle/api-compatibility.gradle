/**
 * The API compatibility gate: the public API of this build against the last release on Maven
 * Central, by japicmp. The family's one pattern (RL-128): this file is the same in every
 * repository, the origin is crypt-data's gradle/api-compatibility.gradle.
 *
 * Semantic versioning decides whether a difference is an error: with the same major version as the
 * baseline, a binary or source incompatible change fails the build, because a minor or patch
 * release must not break a consumer. With a higher major it is written to the report and the build
 * goes on, because a major is where breaking changes belong.
 *
 * A break in a minor or patch is accepted only through a documented entry in
 * gradle/api-compatibility-exclusions.gradle, the one file that differs per repository. Each entry
 * names the element in the japicmp exclude form (package.Class#member, * as wildcard, ; is added
 * between the entries here), the reason the break is accepted and the issue that decided it; an
 * entry without a reason or an issue fails the build. The syntax is that of the japicmp option
 * -e / --exclude (java -jar japicmp-jar-with-dependencies.jar --help). An entry is removed when
 * the next major version is released.
 *
 * apiBaselineVersion in gradle.properties is the last release and moves with every release,
 * in the same commit that opens the next development cycle.
 *
 * The japicmp core runs through JavaExec rather than the Gradle plugin me.champeau.gradle.japicmp,
 * whose last release is from 2025-02; the core is maintained.
 */
configurations {
    japicmpTool {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    japicmpTool(variantOf(libs.japicmp) { classifier('jar-with-dependencies') })
}

apply from: "${rootDir}/gradle/api-compatibility-exclusions.gradle"

def majorOf = { String version -> Integer.parseInt(version.tokenize('.-')[0]) }

/**
 * The released jar, fetched from Maven Central itself. Resolving the coordinates through Gradle
 * does not work here: they are this project's own, and Gradle answers them with the project - the
 * first run compared the new jar with itself and reported no change.
 */
def baselineName = "${rootProject.name}-${apiBaselineVersion}.jar"
def baselineUrl = "https://repo1.maven.org/maven2/${groupPackage.replace('.', '/')}/" +
    "${rootProject.name}/${apiBaselineVersion}/${baselineName}"
def baselineFile = layout.buildDirectory.file("api-baseline/${baselineName}")

tasks.register('apiBaselineJar') {
    description = "Fetches release $apiBaselineVersion from Maven Central as the API baseline"
    inputs.property('url', baselineUrl)
    outputs.file(baselineFile)
    doLast {
        def target = baselineFile.get().asFile
        target.parentFile.mkdirs()
        new URL(baselineUrl).withInputStream { input -> target.withOutputStream { it << input } }
        logger.lifecycle("apiBaselineJar: ${target.length()} bytes from $baselineUrl")
    }
}

tasks.register('apiCompatibility', JavaExec) {
    group = 'verification'
    description = "Compares the public API with release $apiBaselineVersion; breaking it fails within the same major"
    def newJar = tasks.named('jar').flatMap { it.archiveFile }
    def report = layout.buildDirectory.file('reports/japicmp/api-compatibility.html')
    // everything the task action reads is taken here, not from the project in doFirst, so the task
    // also runs with the configuration cache
    def baselineVersion = apiBaselineVersion
    def currentVersion = projectVersion
    def dependencyClasspath = configurations.runtimeClasspath
    def breakingIsAllowed = majorOf(currentVersion) > majorOf(baselineVersion)
    def exclusions = apiCompatibilityExclusions
    dependsOn 'apiBaselineJar'
    inputs.file(baselineFile)
    inputs.file(newJar)
    inputs.property('breakingIsAllowed', breakingIsAllowed)
    inputs.property('exclusions', exclusions.toString())
    outputs.file(report)
    classpath = configurations.japicmpTool
    mainClass = 'japicmp.JApiCmp'
    doFirst {
        def baselineJar = baselineFile.get().asFile
        // fail closed: a baseline that is not the release, or is the jar under test, compares
        // nothing and would report green
        if (!baselineJar.name.contains("-${baselineVersion}.") ||
            baselineJar.canonicalPath == newJar.get().asFile.canonicalPath) {
            throw new GradleException("apiCompatibility: the baseline resolved to " +
                "${baselineJar}, not release $baselineVersion - refusing to compare")
        }
        // an accepted break is documented or it is not accepted
        exclusions.eachWithIndex { entry, index ->
            ['element', 'reason', 'issue'].each { key ->
                if (!entry[key]?.toString()?.trim()) {
                    throw new GradleException("apiCompatibility: entry ${index + 1} of " +
                        "gradle/api-compatibility-exclusions.gradle has no '$key'; every accepted " +
                        "break names its element, its reason and its issue: $entry")
                }
            }
        }
        def classpathAsPath = dependencyClasspath.asPath
        args = ['--old', baselineJar.absolutePath,
                '--new', newJar.get().asFile.absolutePath,
                '--old-classpath', classpathAsPath,
                '--new-classpath', classpathAsPath,
                '--only-modified',
                '--html-file', report.get().asFile.absolutePath]
        if (exclusions) {
            args += ['--exclude', exclusions.collect { it.element.toString().trim() }.join(';')]
        }
        if (breakingIsAllowed) {
            // a major may swap a dependency, as lightblueseas/email-tails 7 swapped javax.mail for
            // jakarta.mail: the baseline then references classes the new classpath no longer has, and
            // japicmp refuses to compare at all. Within a major the classpath is the same and a
            // missing class is a finding, so this is only for the reporting case
            args += ['--ignore-missing-classes']
        } else {
            args += ['--error-on-binary-incompatibility', '--error-on-source-incompatibility']
        }
        logger.lifecycle("apiCompatibility: $currentVersion against release $baselineVersion - " +
            (breakingIsAllowed ? 'a higher major, incompatibilities are reported, not refused'
                               : 'the same major, an incompatibility fails the build') +
            (exclusions ? "; ${exclusions.size()} documented exclusion(s)" : ''))
    }
}

tasks.named('check') {
    dependsOn 'apiCompatibility'
}
