// The manifest names what was built and with which tools, and nothing that changes between two builds of
// the same commit: no build time, no operating system, no JDK patch level, which made the published 13.3
// jar differ from the gate build of the same commit in nothing but these lines (RL-094, RL-116; the wording
// follows silly-bean#24). Which JDK builds a release is named in .sdkmanrc; the manifest keeps the feature
// release as Build-Jdk-Spec, the attribute Maven writes for the same reason.
jar {
    manifest {
        attributes(
                "Name": project.name,
                "Manifest-Version": project.version,
                "Implementation-Title": "$groupPackage" + "." + "$rootProject.name",
                "Implementation-Version": project.version,
                "Implementation-Vendor": "$projectLeaderName",
                "Created-By": "Gradle ${gradle.gradleVersion}",
                "Built-By": "$projectLeaderName",
                "Build-Jdk-Spec": projectSourceCompatibility)
    }
}

// Every archive has fixed entry times and a fixed entry order, so that it depends on the files alone.
// Gradle 9 does this by default; stated here so the build does not depend on that default (silly-bean#24).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
